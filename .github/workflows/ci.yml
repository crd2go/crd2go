# CRD2Go CI
name: CRD 2 Go CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install devbox
      uses: jetify-com/devbox-install-action@05e954310554b6122a26b4880d69937f61b1eb2e # v0.16.0

    - name: CI checks
      env:
        GOTOOLCHAIN: auto
      run: devbox run -- go tool mage ci
