# CRD2Go CI
name: CRD 2 Go CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install devbox
      uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0

    - name: CI checks
      env:
        GOTOOLCHAIN: auto
      run: devbox run -- go tool mage ci
