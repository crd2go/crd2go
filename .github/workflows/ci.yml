# CRD2Go CI
name: CRD 2 Go CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25'

    - name: Install devbox
      uses: jetify-com/devbox-install-action@v0.15.0

    - name: CI checks
      env:
        GOTOOLCHAIN: auto
      run: devbox run -- go tool mage ci
